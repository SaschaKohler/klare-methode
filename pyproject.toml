[project]
name = "klare-methode"
version = "0.1.0"
description = "Klare Methode - Vision Boards and Wheel of Life Coaching App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.0",
    "pillow>=10.0",
    "python-decouple>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "klare_methode.settings"
addopts = "-v --cov=coaching --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
]
